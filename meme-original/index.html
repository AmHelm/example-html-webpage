<html>
<head>
    
    <title>Intern Memes</title>
    <style>
    body {background-color:rgb(231, 246, 221);}
    h1 {text-align: center;}
    h3 {text-align: center;}
    p {text-align: center;}
    div {text-align: center;}
    </style>
</head>
<body>

<h1 style="color:palevioletred">Welcome to the Intern Meme Generator!</h1>
<p>As an intern, I have experienced and learned many new things during my first week. <br>
    I would like to share what it has been like so far...</p>
<h3 style="color:rgb(190, 129, 207)"> Through memes!</h3>

<p><small><sub>&#40;You can click the button several times &#128064;&#41;</sub></small></p>
    
<div>   
    <button type="button" onclick="getMeme()">
        Give me an Intern Meme!
    </button>

</div>

<p id="demo"></p>

<div>
    <label for="newmeme">Submit a new meme:</label><br>
    <input type="text" id="newmeme" name="newmeme" maxlength="200"><br>
    <button type="button" onclick="addMeme()">Submit</button>
</div>

<script>

// Fetches the Json wrapped data from backend
// https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch
async function getMeme() {
    const url = "/api/get_random_meme";
    try {
        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(`Response status: ${response.status}`);
        }

        const meme = await response.json();
        document.getElementById("demo").innerHTML = meme;
    } 
    catch (error) {
        console.error(error.message);
    }
}

// Sends the submitted newmeme to the backend
// https://developer.mozilla.org/en-US/docs/Web/API/Document/getElementById
// This was usefull here as well: https://developer.mozilla.org/en-US/docs/Web/API/Fetch_API/Using_Fetch
async function addMeme() {
    const url = "/api/add_meme";

    const memeInput = document.getElementById("newmeme");

    // Get the value from the submission field
    const submittedMeme = memeInput.value;

    try {
        // fetch uses GET by default, here we have to specify POST
        const response = await fetch(url, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({text: submittedMeme})
        });

        let message = await response.text();
        if (!response.ok) {
            alert(message);
            return;
        }
        alert(message); 

        // Reset the submit field
        memeInput.value = "";
    } 
    catch (error) {
        console.error(error.message);
    }
}

</script>

</body>
