<html>
<head>
    
    <title>Intern Memes</title>
    <style>
    body {background-color:rgb(231, 246, 221);}
    h1 {text-align: center;}
    h3 {text-align: center;}
    p {text-align: center;}
    div {text-align: center;}
    </style>
</head>
<body>

<h1 style="color:palevioletred">Welcome to the Intern Meme Generator!</h1>
<p>As an intern, I have experienced and learned many new things during my first week. <br>
    I would like to share what it has been like so far...</p>
<h3 style="color:rgb(190, 129, 207)"> Through memes!</h3>

<p><small><sub>&#40;You can click the button several times &#128064&#41;</sub></small></p>
    
<div>   
    <button type="randomText" onclick="randomText()">
        Give me an Intern Meme!
    </button>

</div>

<p id="demo"></p>

<script>

function randomText() {
    let randomIndex = Math.floor(Math.random() * beingDifficult.length);
    document.getElementById("demo").innerHTML = beingDifficult[randomIndex];
}

let beingDifficult = ["Still working on it.",
                        "Yeah no, haven't gotten that far yet :/",
                        "No memes yet. Chill.",
                        ":|",
                        "I'm just the intern, I don't know how to add pictures yet &#128133",
                        "FINE, here you go... &#128556 uhh... &#128556",
                        "... Okay, you got me... There are no memes yet",
                        "... Come back tomorrow, K?",
                        "Now this is just awkward for the both of us."];

</script>

</body>
